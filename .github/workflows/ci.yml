name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders — the real values live in the Cloudflare
          # Pages project. The build only needs them to exist.
          NEXT_PUBLIC_NHOST_SUBDOMAIN: ci-placeholder
          NEXT_PUBLIC_NHOST_REGION: eu-central-1

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t attester-api .

      # Proves the bundle starts and answers. No database is reachable, so
      # only the routes that need none are asked.
      - name: Start it and ask for health
        run: |
          docker run -d --name api -p 8787:8787 -e SCHEDULER=off attester-api
          for i in $(seq 1 20); do curl -sf http://localhost:8787/healthz && break; sleep 1; done
          curl -sf http://localhost:8787/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/v1/org/x/certificates)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/nope)" = "404"
          docker logs api

  # The whole system for real: Postgres, Hasura, Nhost Auth, the API image,
  # a mail catcher and a fake Digipost, then one pass through every flow.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the test rig
        run: npm run stack:up

      - name: Run the smoke test
        shell: bash
        run: npm run stack:smoke 2>&1 | tee smoke.log

      - name: Summarise
        if: always()
        run: tail -n 45 smoke.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Show service logs
        if: failure()
        run: npm run stack:logs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E smoke suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
